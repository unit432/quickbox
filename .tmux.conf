# ==============================================================================
# 1. CORE & DISPLAY
# ==============================================================================
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Fix the 'delay' when hitting Esc in Neovim
set -sg escape-time 0
set -g focus-events on

# Start numbering at 1 (easier to reach on keyboard)
set -g base-index 1
setw -g pane-base-index 1

# ==============================================================================
# 2. KEYBINDINGS
# ==============================================================================
# Better Prefix: Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Logical Splits: | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style Pane Navigation (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==============================================================================
# 3. PLUGINS (TPM)
# ==============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'        # Essential: Copy to system clipboard
set -g @plugin 'catppuccin/tmux'

# Persistence Settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# ==============================================================================
# 4. THEME (CATPPUCCIN)
# ==============================================================================
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Status bar modules configuration
# This makes your status bar actually show info (session, user, host, etc)
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# ==============================================================================
# 5. INITIALIZE TPM (MUST BE AT THE VERY BOTTOM)
# ==============================================================================
run '~/.tmux/plugins/tpm/tpm'
